# Sample configuration -- placeholder table/column names, not a real deployment.
# Replace with your own job definitions; database aliases must match
# database.yaml beside this file.
workers: 2
cycleSleepSeconds: 0.5
# What every job would otherwise repeat. A job that names any of these itself
# keeps its own value. A masking policy's `columns` stays with its job, so what
# a job does to its data can be read in one place; only the key is shared.
defaults:
  sourceDatabase: sourceDb
  targetDatabase: targetDb
  insertStrategy: upsert
  chunkSize: 5000
  refresh: 60
  masking:
    key: ${MASKING_KEY}
# What runs write, relative to this file: kept out of the configuration, in a
# transaction/ folder beside it. Run state (last runs, watermarks); a line per
# job per cycle, for `bauta history`; and a sealed record of what was masked,
# for `bauta verify-manifest`. Each can be a table instead:
#   history:
#     database: targetDb
memory: ../transaction/memory.yaml
history: ../transaction/history.jsonl
manifest: ../transaction/manifest.json
jobs:
  # Only what is particular to this job: everything else comes from `defaults`
  # above. `active` is true and `chunkSize` is 5000 unless a job says otherwise.
  # The optional fields a job can also set are targetColumns, targetTableStage,
  # predecessors, retries, timeoutSeconds, preTargetAdhocQueries and
  # postTargetAdhocQueries.
  loadTable1:
    sourceQuery: select id, name, amount from sourceTable1
    targetTableFinal: table1
    sourceQueryColumnTransforms:
      amount:
      - bauta.transform.builtinTransforms:currency
    unmasked: true              # reviewed: these rows carry nothing personal
  loadTable2:
    predecessors:
    - loadTable1
    sourceQuery: select id, table1Id, value from sourceTable2
    targetTableStage: table2Stage
    targetTableFinal: table2
    insertStrategy: swap        # overrides the default
    unmasked: true
  # An incremental job: instead of re-copying the whole table every run, it
  # extracts only the rows whose watermarkColumn is past where the last
  # successful run got to, and the library stores that high-water mark in
  # `memory` between runs.
  #
  # The three parts have to agree, and configuration validation enforces it:
  #   - `{{ watermark }}` in sourceQuery is where the stored value is bound.
  #     It is a *bound parameter*, not text substitution, so the placeholder
  #     goes wherever a value could go -- including inside a join or subquery.
  #   - `watermarkColumn` names which of sourceQuery's own result columns to
  #     take the high-water mark from. It must be one the query actually selects.
  #   - `watermarkInitial` is what the first run binds, before anything is stored.
  #
  # insertStrategy must be `upsert`. `swap` is rejected outright: it replaces the
  # target with the stage table's contents, so staging only the changed rows
  # would delete every row that hadn't changed.
  #
  # The `- interval 5 minute` below is a lookback window, and it is the reason
  # this is safe. A transaction that starts before the run and commits after it,
  # carrying an earlier updated_at, was never visible to the query -- yet a bare
  # `>` watermark would have already moved past it, skipping that row forever.
  # Re-reading a small overlap every run closes that hole, and costs nothing
  # because upsert makes re-loading a row a no-op. Write the arithmetic in your
  # own dialect: postgres `- interval '5 minutes'`, oracle
  # `- numtodsinterval(5, 'minute')`, sqlite `datetime({{ watermark }}, '-5 minutes')`,
  # or plain `- 5` if your watermark is a numeric id rather than a timestamp.
  loadOrdersIncrementally:
    refresh: 5
    sourceQuery: select id, customerId, amount, updatedAt from orders where updatedAt > {{ watermark }} - interval 5 minute
    targetTableFinal: orders
    unmasked: true
    watermarkColumn: updatedAt
    # Unquoted, so YAML reads it as a timestamp: quoted it is text, which
    # PostgreSQL and Oracle refuse to subtract an interval from.
    watermarkInitial: 1970-01-01 00:00:00
  # A masked job: rows are masked between the extract and the load, so the
  # target never sees a real value. See docs/masking.md.
  #
  # Every column sourceQuery returns must be listed -- `keep` for any that need
  # no masking -- or the job fails before writing anything. That's what stops a
  # column added to production later from reaching this copy unmasked.
  #
  # customerId shares the `customer` domain with loadCustomersMasked's id, so
  # the two still join after masking. The key comes from the environment and
  # has no default: rotating it changes every mask.
  loadOrdersMasked:
    predecessors:
    - loadCustomersMasked
    sourceQuery: select id, customerId, amount, shippingPhone, notes from orders
    targetTableFinal: ordersMasked
    masking:                    # the key comes from `defaults`
      columns:
        id: keep
        customerId: {strategy: key, domain: customer}
        amount: {strategy: number, variance: 0.1}
        shippingPhone: digits
        notes: 'null'
  loadCustomersMasked:
    sourceQuery: select id, email, fullName, birthDate from customers
    sourceQueryColumnTransforms:
      email:
      - bauta.transform.builtinTransforms:strip
      - bauta.transform.builtinTransforms:lower
    targetTableFinal: customersMasked
    masking:
      columns:
        id: {strategy: key, domain: customer}
        email: email
        fullName: fakeName
        birthDate: {strategy: dateShift, maxDays: 30}

# Tables no job copies, on purpose. `bauta coverage` lists every table in a
# source database and fails on any that is neither copied nor declared here, so
# a table added to production later can't go unnoticed.
# acknowledged:
#   sourceDb:
#     auditLog: internal audit trail, never leaves production
