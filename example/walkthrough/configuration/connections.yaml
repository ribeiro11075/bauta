# The databases the walkthrough runs against: SQLite files it builds in
# transaction/. A relative path here is relative to this file, so by default
# they are ../transaction/; the demo points them at its working directory
# through the environment. Only this file is written by hand; `subset`
# generates the jobs.
production:
  type: sqlite
  path: ${WALKTHROUGH_PRODUCTION_PATH:-../transaction/production.db}
staging:
  type: sqlite
  path: ${WALKTHROUGH_STAGING_PATH:-../transaction/staging.db}
