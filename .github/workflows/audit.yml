name: Dependency audit

# Known vulnerabilities in what bauta and bauta-rs install. Weekly as well as
# on every change, since an advisory is published against code that hasn't
# changed: a dependency nobody touched becomes vulnerable on its own.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python packages, as constraints/image.txt pins them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      # The set CI's integration job tests, which is what a fresh install
      # resolves to; constraints/lowest.txt is the bottom of each range, kept
      # old on purpose, and would fail on advisories long since fixed above it.
      - name: Audit
        run: pip-audit --strict -r constraints/image.txt

  rust:
    name: Rust crates, as mask-rs/Cargo.lock pins them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit
        working-directory: mask-rs
        run: cargo audit
