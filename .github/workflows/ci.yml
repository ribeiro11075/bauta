name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,fpe]"
      - name: Lint
        run: ruff check
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q

  # The native masker must compute the same masks as the Python it replaces.
  # A difference would not read as a wrong answer but as a changed key, so the
  # suite runs both ways and the crate checks itself against recorded vectors.
  native:
    name: Native masker
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with:
          toolchain: stable
      - name: Install
        run: |
          python -m pip install -e ".[dev,fpe]" maturin
      # --release, not just for speed: two tests measure SHA-256 and AES
      # throughput to catch a backend that has silently fallen back to a
      # software implementation, and a debug build looks exactly like one.
      - name: Crate tests, recorded vectors and backend checks
        working-directory: mask-rs
        run: cargo test --release
      - name: Build and install the extension
        working-directory: mask-rs/py
        run: |
          maturin build --release --out ../target/wheels
          python -m pip install ../target/wheels/bauta_rs-*.whl
      - name: Python suite, with the extension
        run: pytest -q
      - name: Python suite, without it
        run: BAUTA_NATIVE=0 pytest -q
      # The vectors are generated from the Python implementation, so they only
      # mean anything if Python still produces them.
      - name: Vectors still describe the Python implementation
        run: python3 mask-rs/generate_vectors.py && git diff --exit-code mask-rs/vectors/

  # The unit job above takes the newest versions pyproject.toml allows. This
  # runs against real databases with the pinned versions in image.txt, and
  # with the oldest ones pyproject.toml allows, on the oldest Python.
  integration:
    name: Integration tests against real databases, ${{ matrix.versions }} versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - versions: pinned
            python: '3.14'
            constraints: constraints/image.txt
          - versions: lowest
            python: '3.10'
            constraints: constraints/lowest.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Start the databases
        run: docker compose up -d --wait --wait-timeout 600
      - name: Install
        run: python -m pip install --constraint ${{ matrix.constraints }} -e ".[all,dev]"
      - name: Type-check and unit test
        if: matrix.versions == 'lowest'
        run: |
          mypy
          pytest -q
      - name: Test
        if: matrix.versions == 'lowest'
        run: pytest -q -m integration
      # Everything at once, the one run that reaches every line, so coverage
      # is measured here: the unit suite alone can't reach the dialects' SQL.
      - name: Test, with coverage
        if: matrix.versions == 'pinned'
        env:
          # Absolute, since tests change directory and the job processes they
          # start would otherwise write coverage data wherever they are.
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: pytest -q -m "integration or not integration" --cov --cov-fail-under=95
      - name: Database logs
        if: failure()
        run: docker compose logs --tail 200
