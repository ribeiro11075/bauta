# Keeps the pinned versions current: the actions (pinned to commits, with the
# release in a comment), the dev tools and dependency ranges in pyproject.toml,
# and the native masker's Rust crates. Grouped, so each ecosystem is one pull
# request a week rather than one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # pyproject.toml only. constraints/lowest.txt pins the lowest versions the
  # ranges allow, and moving it up would stop CI testing them. image.txt is one
  # resolved set, regenerated whole with the command at its top: edited a pin at
  # a time it stops resolving, as when pydantic-core was moved past the version
  # pydantic requires exactly.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - "constraints/**"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Released with bauta at the same version, and must equal it.
      - dependency-name: bauta-rs

  - package-ecosystem: cargo
    directory: /mask-rs
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # PyO3 converts integers through num-bigint 0.4, and a BigInt from any
      # other version is a different type to it: the extension stops building.
      # Lift this with the PyO3 release whose num-bigint feature moves.
      - dependency-name: num-bigint
        versions: [">=0.5"]
