# Test databases for the integration suite: `docker compose up -d`, then `pytest -m integration`.
name: bauta

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bauta_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bauta_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: bauta_test
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bauta_test
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # amd64-only image (Microsoft ships no arm64 Linux build); runs fine under
    # Docker Desktop's emulation on Apple Silicon, just slower to build/pull
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: "YourStr0ng!Passw0rd"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "YourStr0ng!Passw0rd", "-Q", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # S3 for a files connection's tests. moto rather than MinIO, which no longer
  # publishes images; it speaks the parts of the S3 API bauta uses -- multipart
  # uploads, copies, listing -- and keeps everything in memory.
  s3:
    image: motoserver/moto:5.2.3
    ports:
      - "5055:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Google Cloud Storage, for the same tests; its objects are read anonymously.
  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443"]
    ports:
      - "4443:4443"

  # Azure Blob Storage, for the same tests, with Azurite's well-known account
  # devstoreaccount1. It has no hierarchical namespace, which is the harder
  # case: a move there is a copy and a delete.
  azure:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  # An Iceberg REST catalog -- the Apache Iceberg project's own, for testing
  # -- keeping its tables' files in the s3 service's bucket iceberg-rest.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      CATALOG_WAREHOUSE: s3://iceberg-rest/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:5000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    depends_on:
      s3:
        condition: service_healthy
